<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Shield -->
  <path d="M 256 70 C 350 70 410 100 410 100 C 410 280 256 420 256 420 C 256 420 102 280 102 100 C 102 100 162 70 256 70 Z" 
        fill="url(#shieldGrad)" stroke="#818cf8" stroke-width="8" opacity="0.95" />
  
  <!-- Inner Shield Glow -->
  <path d="M 256 100 C 330 100 380 125 380 125 C 380 265 256 385 256 385 C 256 385 132 265 132 125 C 132 125 182 100 256 100 Z" 
        fill="#1e1b4b" opacity="0.6" />

  <!-- Magnifying Lens Ring -->
  <circle cx="230" cy="220" r="75" fill="none" stroke="url(#lensGrad)" stroke-width="20" filter="url(#glow)" />
  <circle cx="230" cy="220" r="75" fill="none" stroke="#34d399" stroke-width="12" />

  <!-- Verification Checkmark inside Lens -->
  <path d="M 195 220 L 220 245 L 270 190" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lens Handle -->
  <line x1="285" y1="275" x2="350" y2="340" stroke="#10b981" stroke-width="22" stroke-linecap="round" filter="url(#glow)" />
  <line x1="285" y1="275" x2="350" y2="340" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" />
</svg>
