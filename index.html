        <h1>TrustLens — Vérificateur de Fiabilité Vendeur & Détecteur d'Arnaques Marketplace</h1>
        <p>TrustLens est un outil gratuit permettant de vérifier si un vendeur sur Leboncoin, Vinted, Facebook Marketplace ou une boutique e-commerce est fiable ou s'il s'agit d'un escroc.</p>
        <h2>Fonctionnalités principales :</h2>
        <ul>
          <li><strong>Scanner d'URL et de Phishing :</strong> Vérification de l'ancienneté du domaine (RDAP/WHOIS), du certificat SSL HTTPS et des mentions légales.</li>
          <li><strong>Analyseur de Messages Suspects :</strong> Détection automatique des arnaques aux coupons Transcash, PCS, Neosurf, faux livreurs DHL et PayPal entre proches.</li>
          <li><strong>Vérification SIRET / SIREN (Insee Gouv.fr) :</strong> Contrôle en direct de l'existence légale et du statut actif ou radié d'une entreprise.</li>
          <li><strong>Base Communautaire ScamWatch :</strong> Recherche et signalement de numéros de téléphone, IBAN, emails et pseudos frauduleux.</li>
        </ul>
      </main>
    </noscript>
